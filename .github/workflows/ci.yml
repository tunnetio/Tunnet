name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "apps/android/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "apps/android/**"
      - ".github/workflows/ci.yml"

jobs:
  rust:
    name: Rust + Android
    runs-on: ubuntu-latest
    env:
      ANDROID_API_LEVEL: "37.0"
      ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
      ANDROID_NDK_VERSION: "30.0.16248370"
      ANDROID_MIN_SDK: "26"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-key: rust-android

      - name: Install mold
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Format
        run: cargo fmt --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --exclude tunnet-desktop --all-targets --all-features -- -D warnings

      - name: Clippy (tunnet-core no-default)
        run: cargo clippy -p tunnet-core --no-default-features -- -D warnings

      - name: Clippy (SDK managed)
        run: cargo clippy -p tunnet --no-default-features --features managed -- -D warnings

      - name: Clippy (SDK direct)
        run: cargo clippy -p tunnet --no-default-features --features direct -- -D warnings

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version ^4.1 --locked

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android toolchain
        run: |
          sdkmanager --install \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

          NDK="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -d "$NDK"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Clippy (Android)
        run: |
          cargo ndk -t arm64-v8a --platform "${ANDROID_MIN_SDK}" clippy \
            -p tunnet-mobile \
            -p tunnet-agent \
            -- -D warnings
          cargo ndk -t x86_64 --platform "${ANDROID_MIN_SDK}" clippy \
            -p tunnet-mobile \
            -p tunnet-agent \
            -- -D warnings

      - name: Build and check Android app
        working-directory: apps/android
        run: |
          ./gradlew \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --build-cache \
            --stacktrace

      - name: Verify packaged native libraries
        working-directory: apps/android
        run: ./check-apk-abis.sh

  test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Install mold
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run workspace tests
        run: cargo nextest run --workspace --exclude tunnet-desktop --all-features

      - name: Run workspace doctests
        run: cargo test --workspace --exclude tunnet-desktop --all-features --doc
