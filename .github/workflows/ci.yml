name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "apps/docs/**"
      - "**.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "apps/docs/**"
      - "**.md"

jobs:
  rust:
    name: Rust
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Format
        run: cargo fmt --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --exclude tunnet-desktop --all-targets --all-features -- -D warnings

      - name: Clippy (tunnet-core no-default)
        run: cargo clippy -p tunnet-core --no-default-features -- -D warnings

      - name: Clippy (SDK managed)
        run: cargo clippy -p tunnet --no-default-features --features managed -- -D warnings

      - name: Clippy (SDK direct)
        run: cargo clippy -p tunnet --no-default-features --features direct -- -D warnings

  test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Install mold
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run workspace tests
        run: cargo nextest run --workspace --exclude tunnet-desktop --all-features

      - name: Run workspace doctests
        run: cargo test --workspace --exclude tunnet-desktop --all-features --doc

  android:
    name: Android
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: android

      # rustup targets are per-toolchain, so a toolchain bump silently drops
      # them and the cross-compile fails with "can't find crate for `core`".
      # Adding them here is what makes that a CI concern rather than a
      # confusing error on someone's machine.
      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Gradle's cargoBuildAgent cross-compiles per ABI with the NDK's clang,
      # so the assemble below covers the Rust build too. Running the agent
      # crate on its own first keeps a Rust-only break legible, rather than
      # surfacing it as a Gradle failure.
      # The NDK comes from the runner image; setup-android does not install one
      # unless asked. Pinning it here and exporting ANDROID_NDK_HOME means the
      # Gradle leg below resolves the same toolchain (ndkDir() honours the env
      # first) rather than picking its own by a different rule.
      - name: Select the NDK
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/ndk" ]; then
            echo "no NDK under $ANDROID_SDK_ROOT/ndk; install one via setup-android packages:" >&2
            exit 1
          fi
          NDK="$ANDROID_SDK_ROOT/ndk/$(ls "$ANDROID_SDK_ROOT/ndk" | sort -V | tail -1)"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "using NDK $NDK"

      - name: Cross-compile the agent (arm64 only; a x86_64-only break surfaces in the Gradle leg)
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          cargo build -p tunnet-mobile --target aarch64-linux-android --release

      - name: Assemble the APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --no-daemon

      # A missing ABI is invisible until someone installs on that architecture
      # and hits UnsatisfiedLinkError.
      - name: Verify APK carries both ABIs
        working-directory: apps/android
        run: ./check-apk-abis.sh
