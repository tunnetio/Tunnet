[workspace]
resolver = "2"
members = [
  "crates/tunnet-common",
  "crates/tunnet-core",
  "crates/tunnet-client",
  "crates/tunnet",
  "crates/tunnet-control",
  "crates/tunnet-agent",
  "crates/tunnet-cli",
  "crates/tunnet-service",
  "crates/tunnet-update",
  "crates/tunnet-edge",
  "crates/tunnet-relay",
  "crates/tunnet-node-napi",
  "crates/tunnet-policy-napi",
  "crates/tunnet-kube-node",
  "crates/tunnet-operator",
  "crates/tunnet-posture",
  "crates/tunnet-policy-engine",
  "crates/tunnet-audit",
  "crates/tunnet-license",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
kameo = { version = "0.22.2", default-features = false, features = [
  "macros",
  "tracing",
] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
reqwest = { version = "0.13", features = [
  "json",
  "rustls",
], default-features = false }

axum = { version = "0.8", features = ["ws", "macros"] }
httparse = "1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = [
  "tokio",
  "server-auto",
  "server-graceful",
  "service",
] }
http-body-util = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower_governor = { version = "0.8", features = ["axum"] }
tower-http = { version = "0.7", features = [
  "trace",
  "cors",
  "limit",
  "timeout",
] }

dashmap = "6"
parking_lot = "0.12"
arc-swap = "1"

hex = "0.4"
base64 = "0.23"
rand = "0.10"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hmac = "0.13"
sha2 = "0.11"
blake3 = "1"
toml = { version = "1", features = ["preserve_order"] }
bs58 = "0.5"
iroh-mdns-address-lookup = "0.5"
iroh-mainline-address-lookup = "0.5"
argon2 = "0.6"
secrecy = { version = "0.10", features = ["serde"] }
aes-gcm = "0.11"

sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "uuid",
  "json",
  "ipnetwork",
] }
uuid = { version = "1", features = ["v4", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
ipnet = { version = "2", features = ["serde"] }
ipnetwork = { version = "0.21", features = ["serde"] }
netdev = { version = "0.46", default-features = false, features = ["gateway"] }
osdns = { version = "0.1.3", features = ["tracing"] }
prefix-trie = "0.10"
hickory-proto = "0.26"
hickory-resolver = { version = "0.26", default-features = false, features = [
  "tokio",
  "system-config",
  "tls-ring",
  "https-ring",
  "quic-ring",
  "h3-ring",
  "dnssec-ring",
  "rustls-platform-verifier",
  "webpki-roots",
] }

metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# TLS (Serve / Tunnel)
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "tls12",
  "ring",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
rustls-pemfile = "2"
rcgen = "0.14"

# Networking
iroh = { version = "1.1.0" }
noq = { version = "1.2.0" }
noq-proto = { version = "1.2.0" }
iroh-relay = { version = "1.1.0", default-features = false, features = [
  "server",
] }
iroh-gossip = "0.101"
iroh-blobs = "0.103"
iroh-docs = "0.101"
tun-rs = { version = "2", features = ["async_tokio"] }
etherparse = "0.21"
route_manager = { version = "0.2.13", features = ["async"] }
portable-pty = "0.9"
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "2.4"
async-trait = "0.1"
regex = "1"
semver = "1"
sysinfo = "0.39.6"
os_info = "3"
whoami = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
zip = "8.6.0"
sigstore-verify = { version = "0.11.0", default-features = false, features = [
  "rustls",
  "tuf",
] }

# napi-rs
napi = { version = "3", features = [
  "async",
  "tokio_rt",
  "napi9",
  "serde-json",
] }
napi-derive = "3"
napi-build = "2"

# Local
tunnet-common = { version = "0.9.1", path = "crates/tunnet-common" }
tunnet-core = { version = "0.9.1", path = "crates/tunnet-core" }
tunnet-client = { version = "0.9.1", path = "crates/tunnet-client" }
tunnet-service = { version = "0.9.1", path = "crates/tunnet-service" }
tunnet-update = { version = "0.9.1", path = "crates/tunnet-update" }
tunnet-posture = { version = "0.9.1", path = "crates/tunnet-posture" }
tunnet-policy-engine = { version = "0.9.1", path = "crates/tunnet-policy-engine" }
tunnet-audit = { version = "0.9.1", path = "crates/tunnet-audit" }
tunnet-license = { version = "0.9.1", path = "crates/tunnet-license" }
yaml_serde = "0.10.7"
hcl-rs = "0.19"

# Kubernetes operator
kube = { version = "4.2.0", default-features = false, features = [
  "client",
  "runtime",
  "derive",
  "rustls-tls",
] }
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
schemars = "1.2.2"
futures = "0.3"
rstest = "0.26.1"

[profile.release-fast]
inherits = "release"
opt-level = 2
lto = "off"
codegen-units = 64
incremental = true
debug = "line-tables-only"
strip = "none"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
debug = false
strip = "symbols"
