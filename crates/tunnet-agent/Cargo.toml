[package]
name = "tunnet-agent"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[[bin]]
name = "tunnetd"
path = "src/main.rs"
required-features = ["daemon"]

[dependencies]
tunnet-common.workspace = true
tunnet-core = { path = "../tunnet-core", default-features = false, features = [
  "managed",
  "direct",
  "dns",
  "send",
] }

tokio.workspace = true
futures-util.workspace = true
anyhow.workspace = true
thiserror.workspace = true
kameo.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
prost.workspace = true
bytes.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
hex.workspace = true
jiff.workspace = true
uuid.workspace = true
rand.workspace = true
metrics.workspace = true
ipnet.workspace = true
netdev.workspace = true
sha2.workspace = true
reqwest.workspace = true
rustls.workspace = true
clap = { workspace = true, optional = true }
async-trait.workspace = true

iroh.workspace = true
iroh-gossip.workspace = true
iroh-blobs.workspace = true
ed25519-dalek.workspace = true
etherparse.workspace = true
tun-rs.workspace = true
tokio-util = { workspace = true, features = ["rt"] }

tunnet-client = { workspace = true, optional = true }
tunnet-service = { workspace = true, optional = true }
tunnet-update = { workspace = true, optional = true }
tunnet-posture = { workspace = true, optional = true }
tunnet-policy-engine = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
file-rotate = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
osdns = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

# Android routes are installed by VpnService.Builder; this crate does not
# reconcile the kernel table there.
[target.'cfg(not(target_os = "android"))'.dependencies]
route_manager.workspace = true

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
ecdysis = { version = "1.1.1", features = ["tokio_ecdysis", "systemd_notify"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[features]
default = ["daemon"]
ssh = ["dep:russh", "dep:russh-sftp", "dep:portable-pty", "dep:rusqlite"]
updater = ["dep:tunnet-update", "dep:semver", "dep:zip"]
metrics-serve = ["dep:metrics-exporter-prometheus"]
host-dns = ["dep:osdns"]
posture = ["dep:tunnet-posture"]
policy = ["dep:tunnet-policy-engine"]
local-api = [
  "tunnet-core/local_api",
  "tunnet-core/serve",
  "tunnet-core/tunnel",
  "tunnet-core/recording",
  "dep:tunnet-client",
  "dep:clap",
]
daemon = [
  "ssh",
  "updater",
  "metrics-serve",
  "host-dns",
  "posture",
  "policy",
  "local-api",
  "dep:tunnet-service",
  "dep:tracing-subscriber",
  "dep:tracing-appender",
  "dep:file-rotate",
  "dep:dotenvy",
]

[build-dependencies]
prost-build.workspace = true
protox = "0.9"

[dev-dependencies]
rstest.workspace = true
tempfile = "3"
osdns = { workspace = true, features = ["test-util"] }
