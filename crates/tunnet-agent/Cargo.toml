[package]
name = "tunnet-agent"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[[bin]]
name = "tunnetd"
path = "src/main.rs"

[dependencies]
tunnet-common.workspace = true
tunnet-core.workspace = true
tunnet-client.workspace = true
tunnet-service.workspace = true
tunnet-update.workspace = true
tunnet-posture.workspace = true
tunnet-policy-engine.workspace = true

tokio.workspace = true
futures-util.workspace = true
anyhow.workspace = true
thiserror.workspace = true
kameo.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
hex.workspace = true
base64.workspace = true
jiff.workspace = true
uuid.workspace = true
rand.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
ipnet.workspace = true
netdev.workspace = true
osdns.workspace = true
sha2.workspace = true
reqwest.workspace = true
rustls.workspace = true
semver.workspace = true
zip.workspace = true

iroh.workspace = true
iroh-gossip.workspace = true
iroh-blobs.workspace = true
ed25519-dalek.workspace = true
etherparse.workspace = true
tun-rs.workspace = true
portable-pty.workspace = true
russh.workspace = true
russh-sftp.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
tokio-util = { workspace = true, features = ["rt"] }

# Android routes are installed by VpnService.Builder, and route_manager has no
# Android backend. See src/system_routes_android.rs.
[target.'cfg(not(target_os = "android"))'.dependencies]
route_manager.workspace = true

[target.'cfg(unix)'.dependencies]
ecdysis = { version = "1.1.1", features = ["tokio_ecdysis", "systemd_notify"] }
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[features]
default = []
actor-console = ["kameo/console"]

[dev-dependencies]
rstest.workspace = true
tempfile = "3"
osdns = { workspace = true, features = ["test-util"] }
