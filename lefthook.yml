pre-commit:
  parallel: true
  jobs:
    - name: biome-check
      glob: "*.{js,ts,jsx,tsx,json,jsonc,css,mjs,cjs}"
      stage_fixed: true
      run: bun run check --write --no-errors-on-unmatched -- {staged_files}

    - name: rust-fmt
      glob: "**/*.rs"
      stage_fixed: true
      run: cargo fmt

    - name: rust-clippy
      glob: "**/*.rs"
      run: >
        cargo clippy --workspace --all-targets --all-features -- -D warnings &&
        cargo clippy -p tunnet-core --no-default-features -- -D warnings &&
        cargo clippy -p tunnet --no-default-features --features managed -- -D warnings &&
        cargo clippy -p tunnet --no-default-features --features direct -- -D warnings

pre-push:
  jobs:
    - name: rust-nextest
      glob: "**/*.rs"
      run: cargo nextest run --workspace --exclude tunnet-desktop --all-features
